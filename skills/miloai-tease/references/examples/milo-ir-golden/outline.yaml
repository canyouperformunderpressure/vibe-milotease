    name: Opening
    content: |
      Establish the rules and perform one state check.
      Use a button to enter the challenge, then continue to ending after success.
    next:
      - to: ending
        when: Score reaches 1
        priority: main

  ending:
    name: Ending
    content: End the work explicitly.
    next: []
